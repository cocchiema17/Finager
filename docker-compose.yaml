services:
  postgres:
    image: postgres:16-alpine
    container_name: finager-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD on .env is required}
      POSTGRES_DB: ${DB_NAME:-finager}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-finager}"]
      interval: 60s
      timeout: 5s
      retries: 10

  mongodb:
    image: mongo:latest
    container_name: finager-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--norc", "--quiet", "--eval", "db.runCommand({ping: 1}).ok"]
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 20s

  ollama:
    image: ollama/ollama:latest
    container_name: finager-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 60s
      timeout: 5s
      retries: 10

  # Scarica automaticamente il modello scelto al primo avvio del volume
  ollama-pull:
    image: ollama/ollama:latest
    container_name: finager-ollama-pull
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Verifica e download modello $$OLLAMA_MODEL..."
        ollama pull $$OLLAMA_MODEL
        echo "Modello $$OLLAMA_MODEL pronto."
    restart: "no"

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: finager-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      ollama-pull:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - MONGO_URI=mongodb://mongodb:27017
      - OLLAMA_BASE_URL=http://ollama:11434
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 30s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: finager-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      VUE_APP_API_TARGET: http://backend:4000
    ports:
      - "8080:8080"

volumes:
  postgres_data:
  mongo_data:
  ollama_data: